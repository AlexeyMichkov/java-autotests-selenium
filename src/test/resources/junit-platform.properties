# Включаем параллельное выполнение
junit.jupiter.execution.parallel.enabled = true

# Стратегия: concurrent (параллельно)
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# Динамическая стратегия управления потоками
junit.jupiter.execution.parallel.execution-strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 1.0

# Исключаем Selenium тесты из параллельного запуска
# Они не выдерживают параллелизм (несколько Chrome одновременно)
junit.jupiter.execution.parallel.exclude-patterns = **/SauceDemoLoginTest.java,**/AdvancedLocatorsTest.java,**/CartTest.java